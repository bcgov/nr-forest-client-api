name: PR

on:
  pull_request:

env:
  DOMAIN: apps.silver.devops.gov.bc.ca

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  command:
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.oc.outputs.triggered }}
      commands: ${{ steps.oc.outputs.commands }}
    steps:
      - id: oc
        uses: bcgov/actions-openshift/oc-runner@v0.4.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ secrets.oc_server }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: |
            oc create secret generic gwa-acct-id \
            --from-literal=api_key=${{ secrets.GWA_ACCT_ID }} \
            --dry-run=client -o yaml | oc apply -f -
            oc create secret generic gwa-acct-secret \
            --from-literal=api_key=${{ secrets.GWA_ACCT_SECRET }} \
            --dry-run=client -o yaml | oc apply -f -
